<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خير البلد - خير وأكل فلاحي أصيل</title>
    <!-- خط تجوال عربي راقي -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fbf8f3;
            --card-bg: #ffffff;
            --primary-brown: #7c4a03;
            --accent-green: #4a6b32;
            --accent-green-hover: #385225;
            --price-color: #b85d19;
            --text-dark: #2c221e;
            --text-muted: #6e655f;
            --whatsapp-green: #25D366;
            --whatsapp-hover: #1da851;
        }

        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 0;
            transition: all 0.25s ease-in-out;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            padding-bottom: 120px;
        }

        /* الهيدر الأنيق */
        header {
            background: linear-gradient(135deg, #5c3500 0%, #8b5a2b 100%);
            color: #fff;
            text-align: center;
            padding: 35px 20px 25px 20px;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            box-shadow: 0 4px 15px rgba(92, 53, 0, 0.15);
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 6px;
        }

        header p {
            font-size: 0.95rem;
            opacity: 0.9;
            font-weight: 400;
        }

        .container {
            max-width: 1000px;
            margin: 25px auto;
            padding: 0 16px;
        }

        /* شبكة المنتجات */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 22px;
            margin-bottom: 30px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            border: 1px solid rgba(124, 74, 3, 0.08);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.08);
        }

        .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255, 255, 255, 0.92);
            color: var(--primary-brown);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            backdrop-filter: blur(4px);
        }

        .product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 1px solid #f2ece4;
        }

        .product-info {
            padding: 18px;
        }

        .product-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-dark);
        }

        .product-price {
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--price-color);
            margin-bottom: 15px;
        }

        .qty-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f7f3ed;
            padding: 6px 12px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .qty-control label {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .qty-control input {
            width: 70px;
            padding: 6px;
            border: 1px solid #e0d7cd;
            border-radius: 8px;
            text-align: center;
            font-weight: 700;
            background: #fff;
            color: var(--text-dark);
            outline: none;
        }

        .add-btn {
            width: 100%;
            background-color: var(--accent-green);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .add-btn:hover {
            background-color: var(--accent-green-hover);
        }

        /* قسم بيانات الطلب والشحن */
        .order-form-section {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            border: 1px solid rgba(124, 74, 3, 0.08);
            margin-top: 20px;
        }

        .order-form-section h2 {
            font-size: 1.3rem;
            color: var(--primary-brown);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px solid #f2ece4;
            padding-bottom: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .form-group input, .form-group select {
            padding: 12px;
            border: 1px solid #e0d7cd;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            background: #faf8f5;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary-brown);
            background: #fff;
        }

        /* شريط السلة الثابت */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(124, 74, 3, 0.12);
            padding: 14px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -6px 20px rgba(0,0,0,0.06);
            z-index: 1000;
        }

        .cart-info {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .cart-info span {
            color: var(--price-color);
            font-size: 1.3rem;
        }

        .checkout-btn {
            background-color: var(--whatsapp-green);
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(37, 211, 102, 0.35);
        }

        .checkout-btn:hover {
            background-color: var(--whatsapp-hover);
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <header>
        <h1>خير البلد 🌾</h1>
        <p>فطير مشلتت وقرص فلاحي طازجة بالسمن البلدي الأصلي</p>
    </header>

    <div class="container">
        <!-- المنتجات -->
        <div class="products-grid" id="products-container"></div>

        <!-- بيانات التوصيل والدفع -->
        <div class="order-form-section">
            <h2>📝 بيانات الاستلام والدفع</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="cust-name">الاسم بالكامل *</label>
                    <input type="text" id="cust-name" placeholder="أدخل اسمك الكريم">
                </div>

                <div class="form-group">
                    <label for="cust-phone">رقم التليفون / الواتساب *</label>
                    <input type="tel" id="cust-phone" placeholder="01xxxxxxxxx">
                </div>

                <div class="form-group">
                    <label for="delivery-type">طريقة الاستلام *</label>
                    <select id="delivery-type" onchange="toggleAddressField()">
                        <option value="delivery">توصيل للعنوان 🚚</option>
                        <option value="pickup">استلام من موقع العمل 🏪</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="payment-type">طريقة الدفع *</label>
                    <select id="payment-type">
                        <option value="cash">كاش عند الاستلام 💵</option>
                        <option value="instapay">انستا باي InstaPay 📱</option>
                    </select>
                </div>

                <div class="form-group full-width" id="address-group">
                    <label for="cust-address">عنوان التوصيل بالتفصيل *</label>
                    <input type="text" id="cust-address" placeholder="المنطقة، الشارع، رقم العمارة أو علامة مميزة">
                </div>
            </div>
        </div>
    </div>

    <!-- الشريط السفلي -->
    <div class="cart-bar">
        <div class="cart-info">
            الإجمالي: <span id="total-price">0</span> ج.م
        </div>
        <button class="checkout-btn" onclick="sendToWhatsApp()">
            تأكيد الطلب عبر الواتساب 💬
        </button>
    </div>

    <script>
        const myPhoneNumber = "201004398541"; 

        const products = [
            { 
                id: 1, 
                name: "قرص فلاحي طازجة", 
                price: 170, 
                unit: "كيلو", 
                minQty: 1, 
                step: 0.5, 
                image: "qoras.jpg" 
            },
            { 
                id: 2, 
                name: "فطير مشلتت (حجم كبير)", 
                price: 160, 
                unit: "فطيرة", 
                minQty: 1, 
                step: 1, 
                image: "ftir.jpg" 
            },
            { 
                id: 3, 
                name: "فطير مشلتت (حجم صغير)", 
                price: 140, 
                unit: "فطيرة", 
                minQty: 1, 
                step: 1, 
                image: "ftir.jpg" 
            }
        ];

        let cart = {};

        function renderProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = products.map(prod => `
                <div class="product-card">
                    <span class="badge">طازج يومياً ✨</span>
                    <img src="${prod.image}" alt="${prod.name}" class="product-img" onerror="this.src='https://via.placeholder.com/260x200?text=صورة+المنتج'">
                    <div class="product-info">
                        <h3 class="product-title">${prod.name}</h3>
                        <div class="product-price">${prod.price} جنيه / ${prod.unit}</div>
                        <div class="qty-control">
                            <label>الكمية بالـ (${prod.unit}):</label>
                            <input type="number" id="qty-${prod.id}" min="${prod.minQty}" step="${prod.step}" value="${prod.minQty}">
                        </div>
                        <button class="add-btn" onclick="addToCart(${prod.id})">
                            🛒 إضافة للسلة
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            const qtyInput = document.getElementById(`qty-${productId}`);
            const qty = parseFloat(qtyInput.value);

            if (qty > 0) {
                cart[productId] = qty;
                updateTotal();
                alert("تم إضافة المنتج لطلبك بنجاح! ✨");
            }
        }

        function updateTotal() {
            let total = 0;
            for (let id in cart) {
                const product = products.find(p => p.id == id);
                if (product) {
                    total += product.price * cart[id];
                }
            }
            document.getElementById('total-price').innerText = total;
            return total;
        }

        function toggleAddressField() {
            const deliveryType = document.getElementById('delivery-type').value;
            const addressGroup = document.getElementById('address-group');
            if (deliveryType === 'pickup') {
                addressGroup.style.display = 'none';
            } else {
                addressGroup.style.display = 'flex';
            }
        }

        function sendToWhatsApp() {
            const keys = Object.keys(cart);
            if (keys.length === 0) {
                alert("سلتك فارغة! اختر الكمية ودوس إضافة للسلة أولاً.");
                return;
            }

            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const deliveryType = document.getElementById('delivery-type').value;
            const paymentType = document.getElementById('payment-type').value;
            const address = document.getElementById('cust-address').value.trim();

            if (!name || !phone) {
                alert("برجاء إدخال الاسم ورقم التليفون لإتمام الطلب.");
                return;
            }

            if (deliveryType === 'delivery' && !address) {
                alert("برجاء كتابة عنوان التوصيل بالتفصيل.");
                return;
            }

            const deliveryText = deliveryType === 'delivery' ? 'توصيل للعنوان 🚚' : 'استلام من موقع العمل 🏪';
            const paymentText = paymentType === 'cash' ? 'كاش عند الاستلام 💵' : 'انستا باي InstaPay 📱';

            let message = `السلام عليكم، حابب أعمل طلب جديد من موقع *خير البلد*:\n\n`;
            message += `👤 *الاسم:* ${name}\n`;
            message += `📞 *التليفون:* ${phone}\n`;
            message += `📍 *طريقة الاستلام:* ${deliveryText}\n`;
            if (deliveryType === 'delivery') {
                message += `🏡 *العنوان:* ${address}\n`;
            }
            message += `💳 *طريقة الدفع:* ${paymentText}\n\n`;
            message += `📦 *الطلبات:*\n`;

            let total = 0;
            keys.forEach(id => {
                const product = products.find(p => p.id == id);
                const qty = cart[id];
                const itemTotal = product.price * qty;
                total += itemTotal;
                message += `▪️ ${product.name}: ${qty} ${product.unit} (${itemTotal} جنيه)\n`;
            });

            message += `\n💰 *الإجمالي الكلي:* ${total} جنيه`;

            const encodedMessage = encodeURIComponent(message);
            const whatsappURL = `https://wa.me/${myPhoneNumber}?text=${encodedMessage}`;
            window.open(whatsappURL, '_blank');
        }

        renderProducts();
    </script>
</body>
</html>
